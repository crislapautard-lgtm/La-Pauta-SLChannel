name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse -File build/LaPautaSLChannel_artefacts/Release | ForEach-Object { "$($_.Length)  $($_.FullName)" }

      - name: Validate VST3
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process "build/LaPautaSLChannel_artefacts/Release/VST3/La Pauta SL Channel.vst3"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Installer.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaSLChannel-Installer
          path: installer_output/*.exe

      - name: Upload raw VST3
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaSLChannel-VST3
          path: build/LaPautaSLChannel_artefacts/Release/VST3/
